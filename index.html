<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우마무스메 서포트 이벤트 트래커</title><link rel="stylesheet" href="style.css"></head><body><header><h1>서포트 이벤트 트래커</h1><div class="header-tools"><label class="preset-select-label" for="preset-select">편성 세트</label><select id="preset-select" aria-label="편성 세트 선택"><option value="0">세트 1 · 비어 있음</option><option value="1">세트 2 · 비어 있음</option><option value="2">세트 3 · 비어 있음</option></select><button id="preset-save" type="button">저장</button><button id="preset-load" type="button">불러오기</button><button id="reset" type="button">진행 초기화</button></div></header><main><section class="panel"><div id="slots"></div></section><aside class="panel"><h2>시나리오 메모</h2><textarea id="scenario" placeholder="시나리오 기믹이나 목표를 적으세요."></textarea></aside></main><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
