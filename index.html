<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우마무스메 서포트 이벤트 트래커</title><link rel="stylesheet" href="style.css?v=20261031-workspace-v1-1"></head><body><header><h1>서포트 이벤트 트래커</h1><div class="header-tools"><label class="server-label" for="server-mode">서버</label><select id="server-mode" aria-label="서버 선택"><option value="ko">한국</option><option value="jp">일본</option></select><div class="preset-dropdown"><button id="preset-toggle" type="button" aria-expanded="false" aria-controls="preset-menu">편성정보 ▾</button><div id="preset-menu" class="preset-menu" hidden></div></div><span class="header-reset" id="reset-actions"><button id="reset" type="button">진행 초기화</button><button id="secondary-reset" type="button" hidden>보조 도구 초기화</button></span></div></header><nav class="tool-toolbar" aria-label="화면 및 도구 설정">
<label for="view-mode">화면</label><select id="view-mode"><option value="split">동시 사용</option><option value="single">단독 사용</option></select>
<label for="active-tool">도구</label><select id="active-tool" aria-label="사용할 도구"></select>
<label for="split-ratio" class="split-only">분할 비율</label><select id="split-ratio" class="split-only" aria-label="카운팅 영역 비율"><option value="50">5:5</option><option value="60">6:4</option><option value="70">7:3</option></select>
<button id="swap-panels" type="button" class="split-only" title="좌우 위치 바꾸기">⇄ 좌우 전환</button>
</nav>
<main id="workspace" class="workspace split">
<section id="counter-panel" class="panel tool-panel"><div class="panel-title"><h2>서포트 이벤트 카운팅</h2></div><div id="slots"></div></section>
<aside id="memo-panel" class="panel tool-panel"><div class="panel-title"><h2>시나리오 메모</h2></div><textarea id="scenario" placeholder="시나리오 기믹이나 목표를 적으세요."></textarea></aside>
</main><div id="card-picker" class="picker-backdrop" hidden><section class="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title"><div class="picker-heading"><h2 id="picker-title">서포트 카드 선택</h2><button id="picker-close" type="button" aria-label="닫기">✕</button></div><div id="picker-types" class="picker-types" role="group" aria-label="속성 선택"></div><div id="picker-rarities" class="picker-rarities" role="group" aria-label="등급 선택"></div><div id="picker-grid" class="picker-grid"></div><div id="picker-pager" class="picker-pager"></div></section></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=20261031-workspace-v1-1" defer></script></body></html>
