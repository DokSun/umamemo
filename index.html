<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우마무스메 서포트 이벤트 트래커</title><link rel="stylesheet" href="style.css"></head><body><header><h1>서포트 이벤트 트래커</h1><div class="header-tools"><label class="server-label" for="server-mode">서버</label><select id="server-mode" aria-label="서버 선택"><option value="ko">한국</option><option value="jp">일본</option></select><div class="preset-dropdown"><button id="preset-toggle" type="button" aria-expanded="false" aria-controls="preset-menu">편성정보 ▾</button><div id="preset-menu" class="preset-menu" hidden></div></div><button id="reset" type="button">진행 초기화</button></div></header><main><section class="panel"><div id="slots"></div></section><aside class="panel"><h2>시나리오 메모</h2><textarea id="scenario" placeholder="시나리오 기믹이나 목표를 적으세요."></textarea></aside></main><div id="card-picker" class="picker-backdrop" hidden><section class="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title"><div class="picker-heading"><h2 id="picker-title">서포트 카드 선택</h2><button id="picker-close" type="button" aria-label="닫기">✕</button></div><div id="picker-types" class="picker-types" role="group" aria-label="속성 선택"></div><div id="picker-rarities" class="picker-rarities" role="group" aria-label="등급 선택"></div><input id="picker-search" type="search" placeholder="카드 이름 또는 ID 검색" aria-label="카드 검색" autocomplete="off"><div id="picker-grid" class="picker-grid"></div><div id="picker-pager" class="picker-pager"></div></section></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=20261030-card-gallery" defer></script></body></html>
