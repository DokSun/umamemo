<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우마무스메모</title><link rel="stylesheet" href="style.css?v=20261031-preset-preview"></head><body><header><div class="tool-menu-wrap"><button id="tool-menu-toggle" type="button" aria-controls="tool-menu" aria-expanded="false" aria-label="기능 메뉴 열기" title="기능 메뉴">☰ <span>기능</span></button><nav id="tool-menu" class="tool-menu" aria-label="기능 선택" hidden>
<div class="tool-menu-heading">기능 선택</div><div id="tool-menu-list" class="tool-menu-list"></div>
<div class="tool-menu-divider"></div>
<label class="mode-switch-row" for="split-toggle"><span><strong>동시 사용</strong><small>OFF: 단독 / ON: 카운팅 + 선택 도구</small></span><input id="split-toggle" type="checkbox" role="switch" aria-label="동시 사용 켜기"><span class="mode-switch-track" aria-hidden="true"></span></label>
<div class="tool-menu-extras" id="split-options"><fieldset id="split-ratio" class="ratio-fieldset"><legend>화면 비율</legend><div class="ratio-segments" aria-label="카운팅 영역 비율"><label><input type="radio" name="split-ratio" value="50"><span>5:5</span></label><label><input type="radio" name="split-ratio" value="60"><span>6:4</span></label><label><input type="radio" name="split-ratio" value="70"><span>7:3</span></label></div></fieldset><button id="swap-panels" type="button">⇄ 좌우 전환</button></div>
</nav></div><h1>우마무스메모</h1><div class="header-tools"><label class="server-label" for="server-mode">서버</label><select id="server-mode" aria-label="서버 선택"><option value="ko">한국</option><option value="jp">일본</option></select><div class="preset-dropdown"><button id="preset-toggle" type="button" aria-expanded="false" aria-controls="preset-menu">편성정보 ▾</button><div id="preset-menu" class="preset-menu" hidden></div></div></div></header><main id="workspace" class="workspace split">
<section id="counter-panel" class="panel tool-panel"><div class="panel-title"><h2>서포트 이벤트 카운팅</h2></div><div id="slots"></div><div class="panel-reset-footer" id="counter-reset-footer"><button id="reset" type="button">이벤트 카운팅 초기화</button></div></section>
<aside id="memo-panel" class="panel tool-panel"><div class="panel-title"><h2>시나리오 메모</h2></div><textarea id="scenario" placeholder="시나리오 기믹이나 목표를 적으세요."></textarea><div class="panel-reset-footer" id="memo-reset-footer"><button id="secondary-reset" type="button">시나리오 메모 초기화</button></div></aside>
</main><div id="card-picker" class="picker-backdrop" hidden><section class="picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title"><div class="picker-heading"><h2 id="picker-title">서포트 카드 선택</h2><button id="picker-close" type="button" aria-label="닫기">✕</button></div><div id="picker-types" class="picker-types" role="group" aria-label="속성 선택"></div><div id="picker-rarities" class="picker-rarities" role="group" aria-label="등급 선택"></div><div id="picker-grid" class="picker-grid"></div><div id="picker-pager" class="picker-pager"></div></section></div><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=20261031-preset-startup-fix" defer></script></body></html>
