<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우마무스메 서포트 이벤트 트래커</title><link rel="stylesheet" href="style.css"></head><body><header><h1>서포트 이벤트 트래커</h1><div class="header-tools"><label class="server-label" for="server-mode">서버</label><select id="server-mode" aria-label="서버 선택"><option value="ko">한국</option><option value="jp">일본</option></select><div class="preset-dropdown"><button id="preset-toggle" type="button" aria-expanded="false" aria-controls="preset-menu">편성정보 ▾</button><div id="preset-menu" class="preset-menu" hidden></div></div><div class="bulk-image-menu"><button id="bulk-image-toggle" type="button" aria-expanded="false" aria-controls="bulk-image-panel">사진 자동등록 ▾</button><div id="bulk-image-panel" class="bulk-image-panel" hidden><label class="button">이미지 여러 개 선택<input id="bulk-image-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label><label class="button">이미지 폴더 선택<input id="bulk-image-folder" type="file" accept="image/png,image/jpeg,image/webp,image/gif" webkitdirectory directory multiple hidden></label><small>파일명에 카드 ID를 포함하세요. 예: 30001.webp</small><small id="bulk-image-status" role="status" aria-live="polite"></small></div></div><button id="reset" type="button">진행 초기화</button></div></header><main><section class="panel"><div id="slots"></div></section><aside class="panel"><h2>시나리오 메모</h2><textarea id="scenario" placeholder="시나리오 기믹이나 목표를 적으세요."></textarea></aside></main><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=20261030-bulk-photo" defer></script></body></html>
