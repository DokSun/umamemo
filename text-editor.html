<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우마 메모 · 텍스트 편집기</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color-scheme:dark;--bg:#111827;--panel:#1f2937;--line:#374151;--text:#f9fafb;--muted:#9ca3af;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#374151;border:1px solid #4b5563;border-radius:8px;padding:9px 12px}button:hover{background:#4b5563}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}button.primary{background:#2563eb;border-color:#2563eb}.shell{max-width:1350px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(270px,420px) minmax(0,1fr);gap:18px;margin-top:20px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;min-width:0}.panel h2{margin:0 0 12px;font-size:17px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input[type=search],textarea{width:100%;background:#111827;color:var(--text);border:1px solid #4b5563;border-radius:8px;padding:11px}textarea{min-height:100px;resize:vertical}.tree{max-height:65vh;overflow:auto}.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:0;padding:9px 8px}.node:hover,.node.active{background:#374151}.node.group{font-weight:650}.node span{overflow-wrap:anywhere}.node .changed{margin-left:auto;color:#93c5fd}.crumb{color:#93c5fd;font-size:13px;overflow-wrap:anywhere}.field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:6px;color:#d1d5db}.original{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border:1px solid var(--line);border-radius:8px;background:#111827;color:#d1d5db}.changes{border-top:1px solid var(--line);padding-top:15px;margin-top:24px}.changes li{padding:7px 0;overflow-wrap:anywhere}.status{min-height:24px;color:#93c5fd}.note{font-size:13px;line-height:1.7;color:#d1d5db}a{color:#93c5fd}@media(max-width:730px){.layout{grid-template-columns:1fr}.tree{max-height:35vh}.shell{padding:12px}}
</style></head>
<body><main class="shell"><div class="top"><div><h1>우마 메모 · 텍스트 편집기</h1><p class="muted">내비게이션 경로에 따라 문구를 찾고 수정합니다.</p></div><div class="tools"><a href="./">← 사이트로 돌아가기</a><button type="button" id="expand">전체 펼치기</button><button type="button" id="collapse">전체 접기</button></div></div>
<div class="layout">
<section class="panel"><h2>텍스트 목록</h2><input id="search" type="search" placeholder="메뉴, 문구 또는 식별자 검색" aria-label="텍스트 검색"><p class="muted" id="count"></p><nav class="tree" id="tree" aria-label="텍스트 내비게이션"></nav></section>
<section class="panel"><h2>선택한 텍스트</h2><div id="crumb" class="crumb"></div><div class="field"><label for="text-key">식별자</label><input id="text-key" type="search" readonly></div><div class="field"><label>원본 문구</label><div class="original" id="original"></div></div><div class="field"><label for="edited">변경할 문구</label><textarea id="edited"></textarea></div><div class="tools"><button id="restore">이 항목 복원</button><button id="reset-all">전체 수정 초기화</button><button id="view-site" class="primary">사이트에서 확인</button></div><p id="status" class="status" role="status"></p>
<div class="changes"><h2>수정 내역 <span id="changes-count">0</span>개</h2><ol id="changes"></ol><div class="tools"><button id="download-json" class="primary">수정 내역 JSON 내보내기</button><button id="download-js">배포용 ui-text.js 다운로드</button></div><p class="note">편집할 때마다 이 브라우저에 자동 저장되며 같은 브라우저에서 사이트를 열면 수정한 문구가 표시됩니다. 모든 사용자에게 적용하려면 <strong>배포용 ui-text.js</strong>를 다운로드해 GitHub 저장소의 기존 파일에 반영하고 배포해야 합니다. 저장소에 비밀번호나 토큰을 입력하지 마세요.</p></div></section>
</div></main><script src="./ui-text.js"></script><script src="./text-editor.js"></script></body></html>
