name: Refresh external support images

on:
  schedule:
    - cron: '30 19 * * 1' # Every Monday at 04:30 KST
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_image_sources.py'
      - '.github/workflows/update-support-images.yml'

permissions:
  contents: write

concurrency:
  group: update-support-images
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve thumbnail URLs
        run: python scripts/update_image_sources.py
      - name: Probe thumbnail responses (diagnostic)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path
          images = json.loads(Path('data/image_sources.json').read_text())['images']
          for ident in ('10001','30081','30323'):
              url=images.get(ident)
              if not url:
                  print(ident, 'no URL')
                  continue
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      first=response.read(16)
                      print(ident,'status=',response.status,'mime=',response.headers.get('content-type'),'signature=',repr(first))
                      if not response.headers.get('content-type','').startswith('image/'):
                          raise ValueError('Response not an image')
              except Exception as exc:
                  print(ident,'image probe failed:',repr(exc))
          PY
      - name: Commit URL metadata
        run: |
          if [ -z "$(git status --porcelain -- data/image_sources.json)" ]; then
            echo 'No image URL changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/image_sources.json
          git commit -m 'chore: refresh external support image URLs'
          git push
