name: Update JP schedule database
on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate JP schedule from public data
        run: node scripts/update-schedule-jp.mjs
      - name: Commit verified changes
        run: |
          if git diff --quiet -- data/schedule_jp.json; then
            echo "JP database unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule_jp.json
          git commit -m "chore: refresh JP character and race schedule"
          git push
