name: Update support-card database

on:
  schedule:
    - cron: '15 19 * * *' # 04:15 Korea time, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-support-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate GameTora database
        run: python scripts/update_support_db.py
      - name: Commit database changes if any
        run: |
          if git diff --quiet -- data/support_cards.json; then
            echo 'Database already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/support_cards.json
          git commit -m 'chore: refresh support-card database'
          git push
